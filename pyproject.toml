[project]
name = "populate"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.103.1",
    "bleach>=6.4.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.2",
    "flask-migrate>=4.1.0",
    "flask-sqlalchemy>=3.1.1",
    "python-dotenv>=1.2.2",
    "tinycss2>=1.5.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-flask>=1.3.0",
]
